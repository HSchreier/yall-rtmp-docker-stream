# Get host IP at runtime for RTMP endpoint detection
# On Mac: ipconfig getifaddr en0 || ipconfig getifaddr en1
# On Linux: hostname -I | awk '{print $1}'
x-host-ip: &host-ip
  ${HOST_IP:-host.docker.internal}

services:
  mongo:
    image: mongo:7
    ports:
      - "27117:27017"
    volumes:
      - mongo-data:/data/db

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mongo
    ports:
      - "8080:8080"
      - "1935:1935"
    environment:
      MONGO_URI: mongodb://mongo:27017/yallcast-dev
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      HTTP_PORT: "8080"
      # Pass HOST_IP from .env or auto-detect on host machine
      RTMP_HOST_IP: *host-ip
      RTMP_PORT: ${RTMP_PORT:-1935}
      # Enable structured logging with pretty-print (DEBUG=1) or JSON (default)
      DEBUG: ${DEBUG:-}
    # Security: drop all capabilities, add back only what's needed
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Phase 2: Resource limits (prevent resource exhaustion attacks)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
      nproc:
        soft: 512
        hard: 1024
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mongo-data:
