rules:

  - id: updated-by-from-body
    severity: ERROR
    languages: [typescript]
    message: updatedBy must never come from the request body
    pattern: body.updatedBy

  - id: registered-by-from-body
    severity: ERROR
    languages: [typescript]
    message: registeredBy must never come from the request body
    pattern: body.registeredBy

  - id: activated-by-from-body
    severity: ERROR
    languages: [typescript]
    message: activatedBy must never come from the request body
    pattern: body.activatedBy

  - id: role-from-body-unchecked
    severity: WARNING
    languages: [typescript]
    message: role read from request body without authorization check
    pattern: body.role
    paths:
      exclude:
        - "**/src/auth-service.ts"

  - id: secret-like-field-in-event-payload
    severity: WARNING
    languages: [typescript]
    message: EventBus payload should not include credential fields
    patterns:
      - pattern-either:
          - pattern: "$BUS.emit($EVENT, { ..., streamKey: $X, ... })"
          - pattern: "$BUS.emit($EVENT, { ..., password: $X, ... })"
          - pattern: "$BUS.emit($EVENT, { ..., passwordHash: $X, ... })"
          - pattern: "$BUS.emit($EVENT, { ..., token: $X, ... })"
      - metavariable-regex:
          metavariable: $BUS
          regex: '.*[Ee]vent[Bb]us.*'
