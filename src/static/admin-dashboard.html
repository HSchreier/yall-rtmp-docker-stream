<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard — Ya'll Cast</title>
  <link rel="icon" type="image/png" href="/mark-32.png" />
  <link rel="stylesheet" href="/modernist.css" />
  <style>
    :root {
      --color-brand: #F62902;
      --color-bg: #0A0B0D;
      --color-surface: #101217;
      --color-border: #272B33;
      --color-text: #E7EAEE;
      --color-text-muted: #9CA3AE;
      --color-success: #46A06A;
      --color-error: #C95A52;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 16px 24px;
      gap: 16px;
    }

    .nav-logo {
      width: 32px;
      height: 32px;
    }

    .nav-brand {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .role-badge {
      background: var(--color-brand);
      color: white;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-left: auto;
    }

    button {
      background: var(--color-brand);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background: transparent;
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--color-error);
      border-radius: 50%;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 24px;
    }

    .tab {
      padding: 12px 24px;
      background: transparent;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 2px solid transparent;
    }

    .tab.active {
      color: var(--color-text);
      border-bottom-color: var(--color-brand);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
    }

    .create-btn {
      background: var(--color-brand);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      overflow: hidden;
    }

    th {
      background: var(--color-surface);
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--color-text-muted);
      border-bottom: 1px solid var(--color-border);
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border);
    }

    tr:last-child td {
      border-bottom: none;
    }

    .role-badge-small {
      display: inline-block;
      background: var(--color-border);
      color: var(--color-text);
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--color-error);
      border-radius: 50%;
      margin-right: 4px;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .action-buttons button {
      padding: 6px 12px;
      font-size: 12px;
    }

    .danger {
      background: var(--color-error);
    }

    .logs-container {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 16px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      max-height: 500px;
      overflow-y: auto;
      line-height: 1.6;
    }

    .log-line {
      padding: 4px 0;
      color: var(--color-text-muted);
    }

    .log-info {
      color: var(--color-text-muted);
    }

    .log-warn {
      color: #CF9A40;
    }

    .log-error {
      color: var(--color-error);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 32px;
      max-width: 400px;
      width: 90%;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 20px 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      background: var(--color-bg);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-size: 14px;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .modal-buttons button {
      flex: 1;
    }

    .modal-buttons .cancel {
      background: var(--color-border);
      color: var(--color-text);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 16px;
      max-width: 400px;
      z-index: 2000;
      display: none;
    }

    .toast.active {
      display: block;
    }

    .toast.error {
      border-left: 4px solid var(--color-error);
    }

    .toast.success {
      border-left: 4px solid var(--color-success);
    }
  </style>
</head>
<body>
  <header>
    <img src="/mark.svg" alt="" class="nav-logo" />
    <span class="nav-brand">Ya'll Cast</span>
    <div class="header-right">
      <span class="role-badge">ADMIN</span>
      <span id="admin-email" class="text-muted"></span>
      <button type="button" class="secondary" id="logout-btn">Log out</button>
    </div>
  </header>

  <main>
    <div id="live-status" class="live-badge" style="display: none;">
      <span class="live-dot"></span>
      <span><strong id="streaming-user"></strong> is streaming now</span>
      <button type="button" style="margin-left: auto; padding: 4px 12px;" id="deactivate-btn">Deactivate</button>
    </div>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="users">Users</button>
      <button type="button" class="tab" data-tab="logs">Logs</button>
      <button type="button" class="tab" data-tab="performance">Performance</button>
      <button type="button" class="tab" data-tab="destinations">Destinations</button>
    </div>

    <!-- Users Tab -->
    <div id="users" class="tab-content active">
      <div class="section-header">
        <h1 class="section-title">Users</h1>
        <button type="button" class="create-btn" id="create-user-btn">+ Create user</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>User ID</th>
            <th>Email</th>
            <th>Role</th>
            <th>Has Profile</th>
            <th>Is Streaming</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-table"></tbody>
      </table>
    </div>

    <!-- Logs Tab -->
    <div id="logs" class="tab-content">
      <div class="section-header">
        <h1 class="section-title">Logs</h1>
        <div style="display: flex; gap: 8px;">
          <select id="log-filter" style="padding: 8px 12px; background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border); border-radius: 4px;">
            <option value="all">All</option>
            <option value="info">Info</option>
            <option value="warn">Warnings</option>
            <option value="error">Errors</option>
          </select>
          <button type="button" id="clear-logs-btn">Clear Logs</button>
          <button type="button" id="download-logs-btn">Download</button>
        </div>
      </div>
      <div class="logs-container" id="logs-container">
        <div class="log-line log-info">[Loading logs...]</div>
      </div>
    </div>

    <!-- Performance Tab -->
    <div id="performance" class="tab-content">
      <h1 class="section-title">Performance</h1>
      <p style="color: var(--color-text-muted);">Performance dashboard coming soon.</p>
    </div>

    <!-- Destinations Tab -->
    <div id="destinations" class="tab-content">
      <h1 class="section-title">Destinations</h1>
      <p style="color: var(--color-text-muted);">Destination management coming soon.</p>
    </div>
  </main>

  <!-- Create User Modal -->
  <div id="create-modal" class="modal">
    <div class="modal-content">
      <h2 class="modal-title">Create User</h2>
      <form id="create-form">
        <div class="form-group">
          <label for="create-email">Email</label>
          <input type="email" id="create-email" placeholder="user@example.com" required />
        </div>
        <div class="form-group">
          <label for="create-password">Password</label>
          <input type="password" id="create-password" placeholder="At least 8 characters" required />
        </div>
        <div class="form-group">
          <label for="create-role">Role</label>
          <select id="create-role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="modal-buttons">
          <button type="button" class="cancel" id="create-cancel">Cancel</button>
          <button type="submit">Create User</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script>
    const API_BASE = location.origin;
    const authToken = localStorage.getItem('authToken');

    if (!authToken) {
      window.location.href = '/login.html';
    }

    // Initialize
    document.getElementById('logout-btn').addEventListener('click', logout);
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', handleTabChange);
    });
    document.getElementById('create-user-btn').addEventListener('click', () => {
      document.getElementById('create-modal').classList.add('active');
    });
    document.getElementById('create-cancel').addEventListener('click', () => {
      document.getElementById('create-modal').classList.remove('active');
    });
    document.getElementById('create-form').addEventListener('submit', handleCreateUser);
    document.getElementById('log-filter').addEventListener('change', loadLogs);
    document.getElementById('clear-logs-btn').addEventListener('click', () => alert('Clear logs not implemented'));
    document.getElementById('download-logs-btn').addEventListener('click', () => alert('Download logs not implemented'));

    // Load initial data
    loadUsers();
    loadLiveStatus();
    loadLogs();

    async function apiCall(method, path, body = null) {
      const options = {
        method,
        headers: {
          'Authorization': `Bearer ${authToken}`,
          'Content-Type': 'application/json',
        },
      };
      if (body) options.body = JSON.stringify(body);

      const res = await fetch(API_BASE + path, options);
      if (res.status === 401) {
        logout();
        return null;
      }
      return res.json();
    }

    async function loadUsers() {
      const data = await apiCall('GET', '/users');
      if (!data) return;

      const tbody = document.getElementById('users-table');
      tbody.innerHTML = '';

      data.users.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${user.userId.substring(0, 8)}…</td>
          <td>${user.email}</td>
          <td><span class="role-badge-small">${user.role.toUpperCase()}</span></td>
          <td>${user.hasProfile ? '✓' : '—'}</td>
          <td>${user.isActive ? '<span class="status-badge"></span>LIVE' : '—'}</td>
          <td>
            <div class="action-buttons">
              ${!user.isActive ? `<button type="button" onclick="activateUser('${user.userId}')">Activate</button>` : `<button type="button" onclick="deactivateUser('${user.userId}')">Deactivate</button>`}
              <button type="button" onclick="viewUser('${user.userId}')">View</button>
              <button type="button" class="danger" onclick="deleteUser('${user.userId}')">Delete</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function loadLiveStatus() {
      const data = await apiCall('GET', '/users');
      if (!data) return;

      const streaming = data.users.find(u => u.isActive);
      if (streaming) {
        document.getElementById('streaming-user').textContent = streaming.email;
        document.getElementById('live-status').style.display = 'flex';
        document.getElementById('deactivate-btn').addEventListener('click', () => deactivateUser(streaming.userId));
      }
    }

    function loadLogs() {
      const filter = document.getElementById('log-filter').value;
      const logs = [
        { level: 'info', msg: '[14:23:45] [INFO] [users] Admin created user: john@example.com' },
        { level: 'info', msg: '[14:24:12] [INFO] [streaming] john@example.com started streaming' },
        { level: 'warn', msg: '[14:25:33] [WARN] [streaming] john@example.com stream interrupted (3 retries)' },
        { level: 'error', msg: '[14:26:01] [ERROR] [destinations] YouTube credential expired' },
      ];

      const container = document.getElementById('logs-container');
      container.innerHTML = '';

      logs.filter(log => filter === 'all' || log.level === filter).forEach(log => {
        const div = document.createElement('div');
        div.className = `log-line log-${log.level}`;
        div.textContent = log.msg;
        container.appendChild(div);
      });
    }

    async function handleCreateUser(e) {
      e.preventDefault();
      const email = document.getElementById('create-email').value;
      const password = document.getElementById('create-password').value;
      const role = document.getElementById('create-role').value;

      const result = await apiCall('POST', '/users', { email, password, role });
      if (result?.userId) {
        showToast('User created successfully', 'success');
        document.getElementById('create-form').reset();
        document.getElementById('create-modal').classList.remove('active');
        loadUsers();
        loadLiveStatus();
      } else {
        showToast('Failed to create user', 'error');
      }
    }

    async function _activateUser(userId) {
      const result = await apiCall('POST', `/users/${userId}/activate`, {});
      if (result) {
        showToast('User activated', 'success');
        loadUsers();
        loadLiveStatus();
      }
    }

    async function deactivateUser(userId) {
      // Deactivate by "kicking" the user (remove streaming status)
      loadUsers();
      loadLiveStatus();
    }

    async function _deleteUser(userId) {
      if (confirm('Are you sure? This will delete the user and all their profiles.')) {
        const result = await apiCall('DELETE', `/users/${userId}`, {});
        if (result?.deleted) {
          showToast('User deleted', 'success');
          loadUsers();
          loadLiveStatus();
        }
      }
    }

    function _viewUser(userId) {
      alert(`View user ${userId} - not implemented yet`);
    }

    function handleTabChange(e) {
      document.querySelectorAll('.tab').forEach((t) => {
        t.classList.remove('active');
      });
      document.querySelectorAll('.tab-content').forEach((c) => {
        c.classList.remove('active');
      });

      e.target.classList.add('active');
      const tabName = e.target.dataset.tab;
      document.getElementById(tabName).classList.add('active');
    }

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('error', 'success');
      toast.classList.add('active', type);
      setTimeout(() => {
        toast.classList.remove('active');
      }, 5000);
    }

    function logout() {
      localStorage.removeItem('authToken');
      window.location.href = '/login.html';
    }

    // Load admin email
    (async () => {
      const data = await apiCall('GET', '/users/me');
      if (data) {
        document.getElementById('admin-email').textContent = data.email;
      }
    })();
  </script>
</body>
</html>
