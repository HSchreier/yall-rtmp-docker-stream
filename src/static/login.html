<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in — Ya'll Cast</title>
<link rel="icon" type="image/png" href="/mark-32.png" />
<link rel="apple-touch-icon" href="/mark-180.png" />
<link rel="stylesheet" href="/modernist.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<header class="nav">
  <img src="/mark.svg" alt="" class="nav-logo" />
  <span class="nav-brand">Ya'll Cast</span>
  <span class="text-muted">Stream relay · this box</span>
</header>
<main class="page">
  <p class="notice" id="notice" hidden></p>
  <div class="hero-grid">
    <div>
      <p class="card-kicker">Ya'll Cast</p>
      <h1>Log in.</h1>
      <p class="text-muted">Check who's on air, take over the relay, or update your stream keys.</p>
    </div>
    <div>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" required />
        </div>
        <p class="error-text" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>
    </div>
  </div>
</main>
<script src="/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const notice = document.getElementById("notice");
  if (params.get("expired") === "1") {
    notice.hidden = false;
    notice.textContent = "Your session expired — log in again.";
  } else if (params.get("setup") === "done") {
    notice.hidden = false;
    notice.textContent = "Setup is already complete — log in.";
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const res = await fetch(`${location.origin}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();
      if (!res.ok) {
        document.querySelector(".error-text").hidden = false;
        document.querySelector(".error-text").textContent = data.error || "Login failed";
        return;
      }

      // Store auth token and user info
      localStorage.setItem("authToken", data.token);
      localStorage.setItem("userId", data.userId);
      localStorage.setItem("userRole", data.role);

      // Route by role
      if (data.role === "admin") {
        location.href = "/admin-dashboard.html";
      } else {
        location.href = "/user-dashboard.html";
      }
    } catch {
      document.querySelector(".error-text").hidden = false;
      document.querySelector(".error-text").textContent = "Connection error";
    }
  });
</script>
</body>
</html>
