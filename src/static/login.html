<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in — Ya'll Cast</title>
<link rel="stylesheet" href="/modernist.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<header class="nav">
  <span class="nav-brand">Ya'll Cast</span>
  <span class="text-muted">Stream relay · this box</span>
</header>
<main class="page">
  <p class="notice" id="notice" hidden></p>
  <div class="hero-grid">
    <div>
      <p class="card-kicker">Ya'll Cast</p>
      <h1>Log in.</h1>
      <p class="text-muted">Check who's on air, take over the relay, or update your stream keys.</p>
    </div>
    <div>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" required />
        </div>
        <p class="error-text" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>
    </div>
  </div>
</main>
<script src="/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const notice = document.getElementById("notice");
  if (params.get("expired") === "1") {
    notice.hidden = false;
    notice.textContent = "Your session expired — log in again.";
  } else if (params.get("setup") === "done") {
    notice.hidden = false;
    notice.textContent = "Setup is already complete — log in.";
  }

  Yallcast.bindForm("#login-form", async (data) => {
    const res = await Yallcast.api("POST", "/auth/login", data);
    if (res.ok) location.href = "/dashboard.html";
    return res;
  });
</script>
</body>
</html>
