title = "Gitleaks Configuration"
description = "Allowlist for legitimate references to secrets in docs and code"

[extend]
useDefault = true

[allowlist]
description = "Allowlist files that mention secrets in documentation or non-malicious contexts"
paths = [
  '''docs/design-briefs/reference/prototype\.dc\.html''',
  "README.md",
  "openapi.yaml",
  "TECHNICAL.md",
  ".semgrep/security.yml",
  ".env.example",
  "docker-compose.yml",
  "scripts/install.sh"
]
regexes = [
  "JWT_SECRET",
  "ENCRYPTION_KEY",
  "dev-secret",
  "password"
]
